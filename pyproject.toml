[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rss-reader-py"
version = "1.0.0"
description = "CLI for fetching podcast RSS feeds, listing episodes, and downloading them (Python rewrite of rss-reader)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "slegga" }]
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rss-reader = "rss_reader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rss_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
